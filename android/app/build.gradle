plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    compileSdkVersion 34
    
    defaultConfig {
        applicationId "your.package.name"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    // Flutter and Android core dependencies
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    
    // AndroidX Window libraries to resolve missing classes
    def window_version = "1.2.0"
    implementation "androidx.window:window:$window_version"
    implementation "androidx.window:window-core:$window_version"
    implementation "androidx.window:window-extensions:$window_version"
    
    // Keep other existing dependencies
}

// Additional configuration to prevent R8 from removing necessary classes
configurations.all {
    resolutionStrategy {
        force "androidx.window:window:1.2.0"
        force "androidx.window:window-core:1.2.0"
        force "androidx.window:window-extensions:1.2.0"
    }
}